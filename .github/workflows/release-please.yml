name: release-please

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions: {}

# Releases wait for each other and are never cancelled or dropped. The group name differs from the
# called release.yml's group, which a called workflow would otherwise share with its caller.
concurrency:
  group: release-please-caller
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: gate
    # Only main may release or rebuild the release PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      release: ${{ steps.secrets.outputs.release }}
    steps:
      - id: secrets
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY are not set, so release-please is skipped"
          fi

  release-please:
    name: release-please
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Changes made with GITHUB_TOKEN start no workflows; the app's token lets CI run on the release PR.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  release:
    name: release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
